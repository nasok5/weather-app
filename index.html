<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Погода</title>

  <!-- Стили Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Canvas для анимации погоды на фоне -->
  <canvas id="weather-scene"></canvas>

  <div class="app">
    <!-- Верхняя панель -->
    <div class="topbar">
      <h1 class="app__title" data-i18n="app.title">🌤️ Погода</h1>
      <div class="lang" id="lang">
        <button type="button" class="lang__btn" data-lang="ru">RU</button>
        <button type="button" class="lang__btn" data-lang="en">EN</button>
      </div>
    </div>

    <!-- Переключатель единиц -->
    <div class="units" id="units">
      <button type="button" class="units__btn units__btn--active" data-unit="C">°C</button>
      <button type="button" class="units__btn" data-unit="F">°F</button>
    </div>

    <!-- Поиск -->
    <form class="search" id="search-form">
      <input
        type="text"
        class="search__input"
        id="search-input"
        data-i18n-placeholder="search.placeholder"
        placeholder="Введите город..."
        autocomplete="off"
      >
      <button type="submit" class="search__btn" data-i18n="search.button">Найти</button>
    </form>

    <!-- Кнопка геолокации -->
    <button type="button" class="geo-btn" id="geo-btn" data-i18n="geo.button">
      📍 Моё местоположение
    </button>

    <!-- Карточка погоды -->
    <div class="card" id="card">
      <canvas class="card__weather" id="card-weather"></canvas>

      <div class="card__head">
        <div class="card__city" id="city">—</div>
        <button type="button" class="card__fav" id="fav-btn" title="В избранное">☆</button>
      </div>
      <div class="card__icon" id="icon">🌍</div>
      <div class="card__temp" id="temp">—</div>
      <div class="card__desc" id="desc" data-i18n="card.empty">Введите город</div>

      <div class="card__details">
        <div class="detail">
          <span class="detail__label" data-i18n="detail.feels">Ощущается</span>
          <span class="detail__value" id="feels">—</span>
        </div>
        <div class="detail">
          <span class="detail__label" data-i18n="detail.humidity">Влажность</span>
          <span class="detail__value" id="humidity">—</span>
        </div>
        <div class="detail">
          <span class="detail__label" data-i18n="detail.wind">Ветер</span>
          <span class="detail__value" id="wind">—</span>
        </div>
      </div>
    </div>

    <!-- Избранные города -->
    <div class="favorites" id="favorites">
      <h2 class="favorites__title" data-i18n="fav.title">Избранные города</h2>
      <div class="favorites__list" id="favorites-list"></div>
    </div>

    <!-- Почасовой прогноз -->
    <div class="hourly" id="hourly">
      <h2 class="hourly__title" data-i18n="hourly.title">Почасовой прогноз</h2>
      <div class="hourly__list" id="hourly-list"></div>
    </div>

    <!-- Прогноз на 5 дней -->
    <div class="forecast" id="forecast">
      <h2 class="forecast__title" data-i18n="forecast.title">Прогноз на 5 дней</h2>
      <div class="forecast__list" id="forecast-list"></div>
    </div>

    <!-- Карта осадков -->
    <div class="radar" id="radar">
      <h2 class="radar__title" data-i18n="radar.title">Карта осадков</h2>
      <div class="radar__map" id="radar-map"></div>
      <div class="radar__controls">
        <button type="button" class="radar__btn" id="radar-prev">⏮</button>
        <button type="button" class="radar__btn radar__btn--play" id="radar-play">▶</button>
        <button type="button" class="radar__btn" id="radar-next">⏭</button>
        <span class="radar__time" id="radar-time">—</span>
      </div>
      <p class="radar__attribution">
        Weather data by <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a>
      </p>
    </div>

    <p class="hint" id="hint" data-i18n="hint.start">Введите город или нажмите «Моё местоположение»</p>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <script src="script.js"></script>
</body>
</html>
